global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: smartreco
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
  - job_name: smartreco-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:9101"]
